[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fullsample-gmm-dml"
version = "0.1.0"
description = "Full-sample debiased GMM with arbitrary multiway clustered inference"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Research software accompanying arXiv:2602.11333"},
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.9",
  "scikit-learn>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["fullsample_gmm_dml"]
package-dir = {fullsample_gmm_dml = "src"}

[tool.setuptools.package-data]
fullsample_gmm_dml = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
