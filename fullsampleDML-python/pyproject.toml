[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fullsampleDML"
version = "0.1.0"
description = "Full-sample debiased GMM with arbitrary multiway clustered inference"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Kaicheng Chen", email = "chenkaicheng@sufe.edu.cn"},
  {name = "Harold D. Chiang", email = "hdchiang@wisc.edu"},
]
keywords = ["debiased machine learning", "GMM", "multiway clustering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.9",
  "scikit-learn>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/kaichengchen/fullsampleDML-python"
Repository = "https://github.com/kaichengchen/fullsampleDML-python"
Issues = "https://github.com/kaichengchen/fullsampleDML-python/issues"
Paper = "https://arxiv.org/abs/2602.11333"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["fullsampleDML*"]

[tool.setuptools.package-data]
fullsampleDML = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
